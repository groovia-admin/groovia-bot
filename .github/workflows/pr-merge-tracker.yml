name: PR Merge Tracker

# Runs when a PR touching dashboard/ or wa-bot/ is merged into main.
# Records how long the PR was open before merging, both as a run summary
# (visible in the Actions tab for that run) and as a row appended to
# .github/pr-merge-history.md (the running history).

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'wa-bot/**'

run-name: "PR #${{ github.event.pull_request.number }} merged: ${{ github.event.pull_request.title }}"

permissions:
  contents: write

jobs:
  record-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine changed area
        id: area
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR_NUMBER" --json files -q '.files[].path')
          has_dashboard=false
          has_wabot=false
          while IFS= read -r f; do
            case "$f" in
              dashboard/*) has_dashboard=true ;;
              wa-bot/*) has_wabot=true ;;
            esac
          done <<< "$files"
          if [ "$has_dashboard" = true ] && [ "$has_wabot" = true ]; then
            area="dashboard + wa-bot"
          elif [ "$has_dashboard" = true ]; then
            area="dashboard"
          elif [ "$has_wabot" = true ]; then
            area="wa-bot"
          else
            area="other"
          fi
          echo "area=$area" >> "$GITHUB_OUTPUT"

      - name: Compute time to merge
        id: duration
        env:
          CREATED_AT: ${{ github.event.pull_request.created_at }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          created_epoch=$(date -d "$CREATED_AT" +%s)
          merged_epoch=$(date -d "$MERGED_AT" +%s)
          diff=$(( merged_epoch - created_epoch ))
          days=$(( diff / 86400 ))
          hours=$(( (diff % 86400) / 3600 ))
          minutes=$(( (diff % 3600) / 60 ))
          human="${days}d ${hours}h ${minutes}m"
          echo "human=$human" >> "$GITHUB_OUTPUT"
          echo "merged_at_local=$(date -d "$MERGED_AT" '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          AREA: ${{ steps.area.outputs.area }}
          DURATION: ${{ steps.duration.outputs.human }}
          MERGED_AT_LOCAL: ${{ steps.duration.outputs.merged_at_local }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "### PR #$PR_NUMBER merged"
            echo ""
            echo "- **Title:** $PR_TITLE"
            echo "- **Area:** $AREA"
            echo "- **Merged at:** $MERGED_AT_LOCAL"
            echo "- **Time to merge:** $DURATION"
            echo "- [View PR]($PR_URL)"
            echo ""
            echo "Full history: [.github/pr-merge-history.md](../../blob/main/.github/pr-merge-history.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append, commit, and push history log
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          AREA: ${{ steps.area.outputs.area }}
          DURATION: ${{ steps.duration.outputs.human }}
          MERGED_AT_LOCAL: ${{ steps.duration.outputs.merged_at_local }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE=.github/pr-merge-history.md
          SAFE_TITLE=$(printf '%s' "$PR_TITLE" | sed 's/|/\\|/g')
          ROW="| #$PR_NUMBER | $SAFE_TITLE | $AREA | @$PR_AUTHOR | @$MERGED_BY | $MERGED_AT_LOCAL | $DURATION |"

          # Several PRs can merge within the same minute, so several copies of this
          # job race to push to main at once. Rather than rebase a committed patch
          # (which can conflict when two jobs append at the exact same base line),
          # each attempt starts fresh from the latest main, re-appends our row, and
          # commits — that's naturally conflict-free since it's always a pure
          # append at whatever the current end-of-file is.
          attempt=0
          while true; do
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f "$FILE" ]; then
              {
                echo "# PR Merge History"
                echo ""
                echo "| PR | Title | Area | Author | Merged By | Merged At (UTC) | Time to Merge |"
                echo "|----|-------|------|--------|-----------|------------------|----------------|"
              } > "$FILE"
            fi
            echo "$ROW" >> "$FILE"

            git add "$FILE"
            git commit -m "Log merge time for PR #${PR_NUMBER} [skip ci]"

            if git push origin HEAD:main; then
              break
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then
              echo "Failed to push after $attempt attempts"
              exit 1
            fi
            # Backoff grows with attempt count so a burst of back-to-back merges
            # (this raced under 5 concurrent merges before, exceeding the old
            # fixed 5-attempt budget) spreads retries out instead of colliding again.
            sleep $((attempt + RANDOM % 5 + 1))
          done
