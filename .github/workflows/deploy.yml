name: Production Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Deploy Application
    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create deployment record
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const timestamp = new Date().toISOString();

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'Production',
              description: prNumber
                ? `Deployment recorded for PR #${prNumber}`
                : 'Deployment recorded for main branch',
              transient_environment: false,
              production_environment: true,
              auto_merge: false
            });

            core.setOutput('deployment_id', deployment.data.id);
            core.setOutput('timestamp', timestamp);

      - name: Mark deployment as successful
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          TIMESTAMP: ${{ steps.deployment.outputs.timestamp }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER || 0);
            const timestamp = process.env.TIMESTAMP || new Date().toISOString();
            const body = prNumber
              ? `✅ Deployment recorded for PR #${prNumber} at ${timestamp}`
              : `✅ Deployment recorded for main branch at ${timestamp}`;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'success',
              description: `Deployment completed at ${timestamp}`,
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            await core.summary
              .addRaw(`Deployment recorded at ${timestamp}`)
              .write();
